question = "Total quantity ordered for each product name"
gold_tables = ["order_items", "products"]
gold_runbooks = []
gold_sql = "SELECT p.name, SUM(oi.quantity) FROM order_items oi JOIN products p ON p.id = oi.product_id GROUP BY p.name"

