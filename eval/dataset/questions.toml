id = "T06"
split = "test"
category = "runbook"
question = "List the invoice numbers of the overdue invoices"
gold_tables = ["invoices"]
gold_runbooks = ["invoice_status"]
gold_sql = "SELECT invoice_number FROM invoices WHERE status = 'O' AND due_date < CURRENT_DATE"

[[question]]
