# Eval dataset: one file for all three levels.
#
# id            unique id
# split         "dev" (tune prompts on it) or "test" (look at it rarely, report from it)
# category      simple | runbook | payments | devices | support        -> the question needs data
#               chitchat | unanswerable | adversarial                  -> the system must refuse
# gold_tables   tables a correct SQL needs, including the join path (level 1, level 2 input)
# gold_runbooks runbooks a correct SQL needs (level 0 recall, level 2 input)
# gold_sql      a correct SELECT. Without it the question is skipped in level 2 and level 3.
# ordered       true when the row order matters (the question asks for a sorted list)
#
# Every data question has a gold_sql. After you change one, run `make eval-check`: it must give rows.
# Rules for gold_sql: one clear answer. If the question can mean two things, change the question.

[[question]]
id = "T01"
split = "dev"
category = "simple"
question = "List the name of every product"
gold_tables = ["products"]
gold_runbooks = []
gold_sql = "SELECT name FROM products"

[[question]]
id = "T02"
split = "dev"
category = "simple"
question = "List the discount codes that have no end date"
gold_tables = ["discounts"]
gold_runbooks = []
gold_sql = "SELECT code FROM discounts WHERE valid_to IS NULL"

