[[question]]
id = "T05"
split = "dev"
category = "runbook"
question = "Total unpaid invoice amount for each customer name"
gold_tables = ["customers", "accounts", "invoices"]
gold_runbooks = ["invoice_status"]
gold_sql = "SELECT c.name, SUM(i.total_amount) FROM customers c JOIN accounts a ON a.customer_id = c.id JOIN invoices i ON i.account_id = a.id WHERE i.status = 'O' GROUP BY c.name"

